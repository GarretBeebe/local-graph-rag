# ---------------------------------------------------------------------------
# local-graph-rag stack — runs on Windows, macOS, and Linux via Docker.
#
# Ollama runs on the host (not in Docker). Install it from https://ollama.com
# and make sure it is running before starting this stack.
#
# Quick start:
#   cp .env.example .env                                     # fill in QDRANT_API_KEY, NEXTCLOUD_PATH, CODE_PATH
#   cp config/index_config.yaml.example config/index_config.yaml  # customize index paths
#   docker compose up -d qdrant
#   docker compose --profile indexer run --rm indexer   # index documents
#   docker compose up -d api                            # start API (Phase 6+)
#
# Settings: the app services load every variable in .env (env_file), so any setting from
# settings.py can be set there; defaults live in settings.py. Changing .env needs
# `docker compose up -d <service>` (a restart alone keeps the old environment).
# ---------------------------------------------------------------------------

# Container topology, pinned here because `environment:` overrides `env_file:` — a host-side
# value in .env (e.g. QDRANT_URL or OLLAMA_BASE_URL pointing at localhost) must not leak in.
x-rag-env: &rag-env
  QDRANT_HOST: qdrant
  QDRANT_PORT: 6333
  QDRANT_URL: ""
  QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
  OLLAMA_BASE_URL: http://host.docker.internal:11434
  SQLITE_PATH: /app/data/graph.db
  INDEX_CONFIG_PATH: /app/config/index_config.yaml

services:

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: graph-rag-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      QDRANT__TELEMETRY_DISABLED: "true"

  api:
    image: local-graph-rag:latest
    build: .
    container_name: graph-rag-api
    restart: unless-stopped
    command: uvicorn local_graph_rag.web.api_server:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      <<: *rag-env
      # Keep query models loaded between questions; Ollama unloads after 5m by default and a
      # cold load costs tens of seconds on CPU. Batch services keep Ollama's default.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      - graph-data:/app/data
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Run on-demand — not started by `docker compose up`.
  # Usage: docker compose --profile indexer run --rm indexer
  indexer:
    image: local-graph-rag:latest
    build: .
    profiles: ["indexer"]
    command: python -m local_graph_rag.ingest.index_documents
    depends_on:
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment: *rag-env
    volumes:
      - graph-data:/app/data
      - ./config:/app/config:ro
      - ${NEXTCLOUD_PATH:?Set NEXTCLOUD_PATH in .env}:/app/documents/Nextcloud:ro
      - ${CODE_PATH:?Set CODE_PATH in .env}:/app/documents/Code:ro

  # Run on-demand after indexer — not started by `docker compose up`.
  # Usage: docker compose --profile summarizer run --rm summarizer
  summarizer:
    image: local-graph-rag:latest
    build: .
    profiles: ["summarizer"]
    command: python -m local_graph_rag.graph.summarizer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment: *rag-env
    volumes:
      - graph-data:/app/data

volumes:
  qdrant-storage:
  graph-data:
